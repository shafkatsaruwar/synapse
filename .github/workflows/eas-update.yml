name: EAS Update (OTA)

# LifeOS-style: merge to main → publish JS update → TestFlight/production
# builds on the matching channel pick it up on next cold start.
on:
  push:
    branches: [main]
    paths:
      - "synapse-reset/**"
      - ".github/workflows/eas-update.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS Update channel"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse-reset
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: synapse-reset/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Publish update
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_URL: ${{ secrets.EXPO_PUBLIC_APP_URL }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'production' }}"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub secret EXPO_TOKEN."
            exit 1
          fi
          # Prefer a UUID secret; ignore placeholders/slugs so app.config.js can win.
          if [ -n "$EAS_PROJECT_ID" ] && ! echo "$EAS_PROJECT_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Warning: EAS_PROJECT_ID secret is not a UUID; using projectId from app config instead."
            unset EAS_PROJECT_ID
            unset EXPO_PUBLIC_EAS_PROJECT_ID
          fi
          RESOLVED="$(node -e 'const c=require("./app.config.js"); process.stdout.write(String(c.expo?.extra?.eas?.projectId||""))')"
          if ! echo "$RESOLVED" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "No valid EAS project UUID in secret or app config. Set GitHub secret EAS_PROJECT_ID to the UUID from expo.dev → Project settings."
            exit 1
          fi
          export EAS_PROJECT_ID="$RESOLVED"
          export EXPO_PUBLIC_EAS_PROJECT_ID="$RESOLVED"
          npx eas-cli@latest update --channel "$CHANNEL" --message "main@${GITHUB_SHA::7}" --non-interactive
